<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>InFocise To-Do</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="app-card">

    <header class="app-header">
      <img src="assets/icon.svg" alt="InFocise logo" class="app-logo" />
      <div class="app-titles">
        <h1 class="app-title">InFocise To-Do</h1>
        <p class="app-tagline">Plan today. Achieve tomorrow.</p>
      </div>
    </header>

    <form class="task-form" id="taskForm">
      <div class="input-wrapper">
        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <line x1="4" y1="6" x2="16" y2="6"></line>
          <line x1="4" y1="12" x2="12" y2="12"></line>
          <line x1="4" y1="18" x2="9" y2="18"></line>
          <line x1="19" y1="16" x2="19" y2="22"></line>
          <line x1="16" y1="19" x2="22" y2="19"></line>
        </svg>
        <input
          type="text"
          id="taskInput"
          class="task-input"
          placeholder="What needs to be done?"
          autocomplete="off"
          maxlength="120"
        />
      </div>
      <button type="submit" class="add-btn">
        <span class="add-btn-icon">+</span> Add
      </button>
    </form>

    <nav class="filter-tabs" id="filterTabs">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="active">Active</button>
      <button class="filter-tab" data-filter="completed">Completed</button>
    </nav>

    <ul class="task-list" id="taskList"></ul>

    <div class="empty-state" id="emptyState">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3h6a1 1 0 0 1 1 1v1H8V4a1 1 0 0 1 1-1z"></path>
        <rect x="5" y="5" width="14" height="16" rx="2"></rect>
        <line x1="8" y1="11" x2="16" y2="11"></line>
        <line x1="8" y1="15" x2="16" y2="15"></line>
      </svg>
      <p>No tasks yet — add one above!</p>
    </div>

    <footer class="app-footer">
      <div class="task-count">
        <span class="count-icon">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <line x1="8" y1="6" x2="21" y2="6"></line>
            <line x1="8" y1="12" x2="21" y2="12"></line>
            <line x1="8" y1="18" x2="21" y2="18"></line>
            <line x1="3" y1="6" x2="3.01" y2="6"></line>
            <line x1="3" y1="12" x2="3.01" y2="12"></line>
            <line x1="3" y1="18" x2="3.01" y2="18"></line>
          </svg>
        </span>
        <span id="itemsLeft">0 items left</span>
      </div>
      <button class="clear-btn" id="clearCompleted">
        Clear completed
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path>
          <path d="M10 11v6"></path>
          <path d="M14 11v6"></path>
          <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path>
        </svg>
      </button>
    </footer>

  </main>

  <script src="js/storage.js"></script>
  <script src="js/render.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
